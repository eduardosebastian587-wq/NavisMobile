name: Android APK
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: NavisMobile-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk NavisMobile-debug.apk
          gh release create "build-${{ github.run_number }}" NavisMobile-debug.apk \
            --target "${{ github.sha }}" \
            --title "NavisMobile build ${{ github.run_number }}" \
            --notes "APK debug. Commit ${{ github.sha }} (rama ${{ github.ref_name }})." \
            --latest
